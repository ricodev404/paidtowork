<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paid To Work — Entre e Ganhe</title>

<meta name="description"
content="Paid To Work — realize tarefas, acumule ganhos e acompanhe suas atividades.">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #050811;
  --card: #0c1220;
  --card2: #10192b;
  --blue: #138cff;
  --blue2: #00c6ff;
  --text: #ffffff;
  --muted: #8d9ab0;
  --border: rgba(255,255,255,.08);
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(19,140,255,.20), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(0,198,255,.12), transparent 30%),
    var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 1050px;
  min-height: 620px;
  display: grid;
  grid-template-columns: 1fr 430px;
  background: rgba(8,14,25,.86);
  border: 1px solid var(--border);
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 30px 100px rgba(0,0,0,.55),
    0 0 60px rgba(19,140,255,.08);
  backdrop-filter: blur(18px);
}

/* LADO ESQUERDO */

.hero {
  position: relative;
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background:
    linear-gradient(
      135deg,
      rgba(19,140,255,.16),
      transparent 55%
    );
}

.logo {
  font-size: 31px;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 55px;
}

.logo span {
  color: var(--blue2);
}

.badge {
  display: inline-block;
  width: fit-content;
  padding: 8px 14px;
  border-radius: 30px;
  background: rgba(19,140,255,.12);
  border: 1px solid rgba(19,140,255,.25);
  color: #62bdff;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 22px;
}

.hero h1 {
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1.02;
  letter-spacing: -3px;
  max-width: 560px;
}

.hero h1 span {
  background: linear-gradient(
    90deg,
    #138cff,
    #00d4ff
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
  max-width: 500px;
  margin-top: 25px;
}

.features {
  display: flex;
  gap: 25px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.feature {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #cbd6e8;
  font-size: 14px;
}

.feature-icon {
  width: 35px;
  height: 35px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: rgba(19,140,255,.12);
  color: #40adff;
}

/* LOGIN */

.auth {
  padding: 45px;
  background: rgba(10,17,30,.88);
  border-left: 1px solid var(--border);
  display: flex;
  align-items: center;
}

.auth-box {
  width: 100%;
}

.auth-box h2 {
  font-size: 30px;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 30px;
}

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  color: #c9d4e5;
  font-size: 13px;
}

.field input {
  width: 100%;
  height: 52px;
  border-radius: 13px;
  border: 1px solid var(--border);
  outline: none;
  background: #080e19;
  color: white;
  padding: 0 15px;
  font-size: 15px;
  transition: .2s;
}

.field input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(19,140,255,.10);
}

button {
  width: 100%;
  height: 54px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  color: white;
  font-size: 15px;
  font-weight: 800;
  background:
    linear-gradient(
      100deg,
      #0879e8,
      #00b8ff
    );
  box-shadow:
    0 12px 30px rgba(0,145,255,.22);
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow:
    0 16px 35px rgba(0,145,255,.30);
}

button:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

.message {
  min-height: 20px;
  margin: 14px 0;
  font-size: 13px;
  text-align: center;
}

.message.error {
  color: #ff6b7a;
}

.message.success {
  color: #35e6a1;
}

.switch {
  margin-top: 25px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.switch button {
  width: auto;
  height: auto;
  padding: 0;
  margin-left: 5px;
  background: transparent;
  box-shadow: none;
  color: #43b4ff;
  font-weight: bold;
}

.switch button:hover {
  transform: none;
}

/* MOBILE */

@media(max-width: 800px) {

  body {
    padding: 12px;
  }

  .container {
    grid-template-columns: 1fr;
    min-height: auto;
    border-radius: 22px;
  }

  .hero {
    padding: 35px 25px;
  }

  .logo {
    margin-bottom: 35px;
  }

  .hero h1 {
    font-size: 43px;
  }

  .hero p {
    font-size: 15px;
  }

  .features {
    margin-top: 25px;
  }

  .auth {
    padding: 30px 25px;
    border-left: none;
    border-top: 1px solid var(--border);
  }

}

</style>

</head>

<body>

<div class="container">

  <section class="hero">

    <div class="logo">
      PAID<span>TO</span>WORK
    </div>

    <div class="badge">
      🚀 NOVA FORMA DE GANHAR
    </div>

    <h1>
      Trabalhe online.<br>
      <span>Acumule ganhos.</span>
    </h1>

    <p>
      Realize tarefas disponíveis na plataforma,
      acompanhe seu desempenho e acumule saldo
      dentro do Paid To Work.
    </p>

    <div class="features">

      <div class="feature">
        <div class="feature-icon">✓</div>
        Tarefas
      </div>

      <div class="feature">
        <div class="feature-icon">₿</div>
        Ganhos
      </div>

      <div class="feature">
        <div class="feature-icon">↗</div>
        Indicações
      </div>

    </div>

  </section>

  <section class="auth">

    <div class="auth-box">

      <h2 id="formTitle">
        Criar conta
      </h2>

      <p class="subtitle">
        Comece agora no Paid To Work.
      </p>

      <form id="authForm">

        <div class="field">
          <label>Nome</label>
          <input
            id="name"
            type="text"
            placeholder="Seu nome"
            autocomplete="name"
          >
        </div>

        <div class="field">
          <label>E-mail</label>
          <input
            id="email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label>Senha</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="field">
          <label>Confirmar senha</label>
          <input
            id="confirmPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
          >
        </div>

        <div
          id="message"
          class="message"
        ></div>

        <button
          id="submitButton"
          type="submit"
        >
          Criar minha conta
        </button>

      </form>

      <div class="switch">

        <span id="switchText">
          Já possui uma conta?
        </span>

        <button
          type="button"
          id="switchButton"
        >
          Entrar
        </button>

      </div>

    </div>

  </section>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
